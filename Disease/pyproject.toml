[project]
name = "parkinsons-detection-system"
version = "0.1.0"
description = "Parkinson's Disease Detection System using AI and multimodal analysis"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.30.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "plotly>=5.18.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "opencv-python>=4.8.0",
    "mediapipe>=0.10.0",
    "pillow>=10.0.0",
    "seaborn>=0.12.0",
    "matplotlib>=3.7.0",
    "joblib>=1.3.0",
    "reportlab>=4.0.0",
    "streamlit-drawable-canvas>=0.9.0",
    "librosa>=0.11.0",
    "soundfile>=0.13.1",
]

[tool.setuptools]
packages = []
